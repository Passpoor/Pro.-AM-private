name: PubMed - CAR-M

on:
  schedule:
    - cron: '30 23 * * *'   # UTC 23:30 = 北京 07:30
  workflow_dispatch:

jobs:
  pubmed-car-m:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install biopython deep-translator

      - name: Run PubMed fetcher
        env:
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
        run: python pubmed_fetcher.py --config config_car_m

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state_config_car_m.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "update state_car_m $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
