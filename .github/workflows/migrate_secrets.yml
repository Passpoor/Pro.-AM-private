name: Migrate Secrets

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Migrate secrets to Papfast-private
        env:
          GH_TOKEN: ${{ secrets.PAT_MIGRATE }}
          SMTP: ${{ secrets.SMTP_AUTH_CODE }}
          ZHIPU: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          echo "$SMTP" | gh secret set SMTP_AUTH_CODE -R Passpoor/Papfast-private
          echo "$ZHIPU" | gh secret set ZHIPU_API_KEY -R Passpoor/Papfast-private
          echo "✅ Secrets migrated successfully"
